name: Review provenance gate
on:
  pull_request:
    paths:
      - 'src/components/GoogleReviewsSlider.tsx'
      - 'scripts/test-review-provenance.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/review-provenance.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:review-provenance
