name: Merchant Center data integrity
on:
  pull_request:
    paths:
      - 'src/lib/seo.ts'
      - 'src/app/feeds/merchant.xml/route.ts'
      - 'scripts/test-merchant-gtin.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/merchant-data-integrity.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runner Node.js version
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:merchant-gtin
