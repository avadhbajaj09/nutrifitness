name: NutriFitness integrated release candidate
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/**'
      - 'DELIVERY_ENGINE.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-candidate.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm Node.js compatibility
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
      - name: Install audited lockfile dependencies
        run: npm ci --ignore-scripts
      - name: Run all security, commerce and SEO regression tests
        run: npm run test:release-safety
      - name: Dependency vulnerability overview (read-only)
        run: npm audit --omit=dev --audit-level=moderate || true
